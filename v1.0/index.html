<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Site Under Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#214215; /* deep navy */
      --card:#0b1220;
      --accent:#ffb86b;
      --muted:#9aa7b2;
      --glass: rgba(255,255,255,0.04);
      --radius:18px;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background: radial-gradient(1200px 600px at 10% 10%, rgba(255,184,107,0.06), transparent),
                  radial-gradient(900px 400px at 90% 90%, rgba(99,102,241,0.035), transparent),
                  var(--bg);
      color:#e6eef6;
      -webkit-font-smoothing:antialiased;
      display:flex;align-items:center;justify-content:center;padding:40px;
      line-height:1.35;
    }

    .card{
      width:100%;max-width:960px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius:var(--radius);padding:36px;display:grid;grid-template-columns:1fr 420px;gap:28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }

    .left{display:flex;flex-direction:column;gap:18px;justify-content:center}
    h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-0.5px}
    p.lead{color:var(--muted);margin:0;font-size:15px}

    .features{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
    .chip{background:var(--glass);padding:8px 12px;border-radius:999px;font-weight:600;color:var(--muted);font-size:13px}

    .countdown{margin-top:18px;display:flex;gap:10px}
    .countdown .block{background:#071126;padding:12px 14px;border-radius:10px;min-width:68px;text-align:center}
    .countdown .num{font-weight:800;font-size:18px}
    .countdown .lbl{font-size:11px;color:var(--muted);margin-top:4px}

    /* right column */
    .right{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
    .illustration{width:100%;max-width:320px;height:220px;display:flex;align-items:center;justify-content:center}

    /* animated gear */
    .gear{width:140px;height:140px;background:conic-gradient(from 290deg at 50% 50%, rgba(255,255,255,0.04), rgba(255,255,255,0.02));border-radius:50%;display:grid;place-items:center;position:relative}
    .gear:before{content:"";position:absolute;inset:18px;border-radius:50%;background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent)}
    .cog{width:86px;height:86px;border-radius:50%;position:relative;display:grid;place-items:center}
    .cog svg{width:86px;height:86px;transform-origin:center center;animation:spin 6s linear infinite}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    .notify{margin-top:12px;text-align:center}
    .notify input{width:100%;padding:12px 14px;border-radius:12px;border:none;background:#071126;color:inherit;font-size:14px}
    .notify .btn{margin-top:10px;width:100%;padding:12px 14px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--accent),#ffd9b8);font-weight:700}

    .socials{display:flex;gap:10px;margin-top:12px}
    .socials a{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--glass);text-decoration:none;color:var(--muted);font-weight:700}

    footer.small{margin-top:12px;color:var(--muted);font-size:13px}

    /* responsive */
    @media (max-width:880px){
      .card{grid-template-columns:1fr;max-width:620px}
      .right{order:-1}
      .gear{margin-bottom:6px}
    }

  </style>
</head>
<body>
  <main class="card" role="region" aria-label="Under construction">
    <section class="left">
      <div>
        <h1>We're building something awesome</h1>
        <!--<p class="lead">Thanks for stopping by — our site is under construction. We'll be back soon with new features and improvements.</p>-->
      </div>

      <!--<div class="features" aria-hidden>
        <span class="chip">New design</span>
        <span class="chip">Easier checkout</span>
        <span class="chip">Improved speed</span>
        <span class="chip">Mobile friendly</span>
      </div>-->

      <div class="countdown" aria-live="polite">
        <div class="block"><div class="num" id="days">--</div><div class="lbl">Days</div></div>
        <div class="block"><div class="num" id="hours">--</div><div class="lbl">Hours</div></div>
        <div class="block"><div class="num" id="mins">--</div><div class="lbl">Mins</div></div>
        <div class="block"><div class="num" id="secs">--</div><div class="lbl">Secs</div></div>
      </div>

      <!--<div style="max-width:420px;margin-top:14px">
        <form class="notify" onsubmit="event.preventDefault(); alert('Thanks — we\'ll notify you!');">
          <label for="email" class="sr-only" style="display:none">Email</label>
          <input id="email" type="email" placeholder="Enter your email to get notified" required />
          <button class="btn" type="submit">Notify me</button>
        </form>

        <div class="socials" aria-hidden>
          <a href="#" title="Twitter">T</a>
          <a href="#" title="Facebook">F</a>
          <a href="#" title="LinkedIn">in</a>
        </div>

        <footer class="small">Need help? Email <a href="mailto:hello@example.com" style="color:inherit">hello@example.com</a></footer>
      </div>-->
    </section>

    <aside class="right">
      <div class="illustration">
        <div class="gear" role="img" aria-label="animated gear">
          <div class="cog">
            <!-- simple SVG cog -->
            <svg viewBox="0 0 100 100" aria-hidden>
              <g fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffd9b8" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
                </defs>
                <path d="M50 30 A20 20 0 1 1 49.9 30" stroke-linecap="round"/>
                <path d="M50 12 L50 22"/>
                <path d="M50 78 L50 88"/>
                <path d="M12 50 L22 50"/>
                <path d="M78 50 L88 50"/>
                <path d="M26 26 L34 34"/>
                <path d="M74 74 L66 66"/>
                <path d="M74 26 L66 34"/>
                <path d="M26 74 L34 66"/>
              </g>
            </svg>
          </div>
        </div>
      </div>

      <div style="text-align:center;margin-top:6px">
        <strong style="font-size:15px">Site maintenance</strong>
        <div style="color:var(--muted);margin-top:6px">We're polishing things up. Thanks for your patience.</div>
      </div>
    </aside>

  </main>

  <script>
    // simple countdown (set target date below)
    const target = new Date();
    target.setDate(target.getDate() + 10); // default: 10 days from now — change as needed

    function pad(n){return String(n).padStart(2,'0')}
    function tick(){
      const now = new Date();
      let diff = Math.max(0, target - now);
      const days = Math.floor(diff / (1000*60*60*24)); diff -= days*(1000*60*60*24);
      const hours = Math.floor(diff / (1000*60*60)); diff -= hours*(1000*60*60);
      const mins = Math.floor(diff / (1000*60)); diff -= mins*(1000*60);
      const secs = Math.floor(diff/1000);
      document.getElementById('days').textContent = pad(days);
      document.getElementById('hours').textContent = pad(hours);
      document.getElementById('mins').textContent = pad(mins);
      document.getElementById('secs').textContent = pad(secs);
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
