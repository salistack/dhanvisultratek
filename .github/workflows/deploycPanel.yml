name: Deploy Website to cPanel
on:
  push:
    branches:
      - salistack
      - main
jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install FTP Deploy Tool
      run: |
        npm install -g @samkirkland/ftp-deploy
    
    - name: Deploy to cPanel via FTP
      run: |
        npx ftp-deploy --server "dhanvisultratek.com" \
                       --username "${{ secrets.FTP_USERNAME }}" \
                       --password "${{ secrets.FTP_PASSWORD }}" \
                       --local-dir "./v1.0/" \
                       --server-dir "/public_html/" \
                       --verbose \
                       --exclude "**/.git*" "**/.git*/**" "**/node_modules/**" "**/.DS_Store" "**/Thumbs.db"
