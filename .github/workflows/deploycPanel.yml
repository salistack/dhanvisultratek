name: Deploy Website to cPanel
on:
  push:
    branches:
      - salistack
      - main
jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp
    
    - name: Test FTP Connection and Find Directory
      run: |
        lftp -f "
        set ssl:verify-certificate false
        set ftp:ssl-allow false
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} dhanvisultratek.com
        pwd
        ls -la
        bye
        "
    
    - name: Deploy to cPanel Root Directory
      run: |
        lftp -f "
        set ssl:verify-certificate false
        set ftp:ssl-allow false
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} dhanvisultratek.com
        mirror --reverse --delete --verbose --exclude-glob .git* --exclude-glob .github* --exclude-glob README.md --exclude-glob *.md ./ ./
        bye
        "
