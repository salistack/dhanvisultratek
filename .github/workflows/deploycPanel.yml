name: Deploy Website to cPanel
on:
  push:
    branches:
      - salistack
      - main
  workflow_dispatch:  # Manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Deploy ALL files via LFTP
      run: |
        lftp -f "
        set ssl:verify-certificate false
        set ftp:ssl-allow false
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftp.dhanvisultratek.com
        mirror --reverse --delete --verbose \
          --exclude-glob .git/ \
          --exclude-glob .git* \
          --exclude-glob .github/ \
          --exclude-glob README.md \
          --exclude-glob *.md \
          --exclude-glob deploy-manual.bat \
          --exclude-glob deploy-manual.sh \
          --exclude-glob .ftpignore \
          --exclude-glob node_modules/ \
          --exclude-glob .env \
          --exclude-glob .env.local \
          ./ /public_html/
        bye
        "
