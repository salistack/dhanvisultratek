name: Deploy Website to cPanel
on:
  push:
    branches:
      - salistack
      - main
jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp
    
    - name: Deploy to cPanel via LFTP
      run: |
        lftp -f "
        set ssl:verify-certificate false
        set ftp:ssl-allow false
        set ftp:passive-mode true
        set cmd:fail-exit true
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} dhanvisultratek.com
        cd public_html
        mirror --reverse --delete --verbose --parallel=3 --exclude-glob=.git* --exclude-glob=.github* --exclude-glob=README.md --exclude-glob=*.md --exclude-glob=.ftpignore ./ ./
        bye
        "
