name: Deploy Website to cPanel
on:
  push:
    branches:
      - salistack
      - main
jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Fast Deploy Core Files
      run: |
        curl -T index.php ftp://dhanvisultratek.com/ -u ${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}
        curl -T about.php ftp://dhanvisultratek.com/ -u ${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}
        curl -T contact.php ftp://dhanvisultratek.com/ -u ${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}
        curl -T services.php ftp://dhanvisultratek.com/ -u ${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}
        curl --ftp-create-dirs -T css/style.css ftp://dhanvisultratek.com/css/ -u ${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}
        curl --ftp-create-dirs -T js/init.js ftp://dhanvisultratek.com/js/ -u ${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}
