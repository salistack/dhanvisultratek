name: Alternative Deploy to cPanel
on:
  workflow_dispatch:  # Manual trigger
jobs:
  deploy:
    name: Deploy to cPanel (Alternative)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp
    
    - name: Deploy via LFTP
      run: |
        lftp -f "
        set ssl:verify-certificate false
        set ftp:ssl-allow false
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} dhanvisultratek.com
        mirror --reverse --delete --verbose --exclude-glob .git* --exclude-glob .github* --exclude-glob README.md --exclude-glob *.md ./ /public_html/
        bye
        "